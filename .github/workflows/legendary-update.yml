name: Professional Profile Update

on:
  schedule:
    - cron: '0 12 * * *'  # Run daily at noon for maximum epicness
  workflow_dispatch:

jobs:
  professional-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update Professional Stats
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: 'Update professional stats'
          MAX_LINES: 5
          
      - name: Generate Professional Stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_PROFILE_VIEWS: true
          SHOW_LANGUAGE: true
          SHOW_OS: true
          SHOW_EDITORS: true
          SHOW_LOC_CHART: true
          SHOW_LINES_OF_CODE: true
          SHOW_PROJECTS: true
          SHOW_ACTIVITY_GRAPH: true
          SHOW_SHORT_INFO: true
          SHOW_LOC: true
          SHOW_TIMEZONE: true
          SHOW_COMMIT: true
          SHOW_DAYS_OF_WEEK: true
          SHOW_LANGUAGE_PER_REPO: true
          SHOW_GITHUB_STATS: true
          SHOW_DAILY_DEV_TIME: true
          SHOW_PROFILE_VIEWS: true
          SHOW_FOREST: true
          SHOW_FOREST_DETAILS: true
          FOREST_TOP_LANG_COUNT: 6
          FOREST_CHART_COLORS: '#8B5CF6,#10B981,#7C3AED,#6366F1,#4ECDC4'
          FOREST_ICONS_THEME: 'classic'
          FOREST_ICONS_THEME_COLOR: '#8B5CF6'
          FOREST_ICONS_THEME_COLOR_2: '#10B981'
          FOREST_ICONS_THEME_COLOR_3: '#7C3AED'
          FOREST_ICONS_THEME_COLOR_4: '#6366F1'
          FOREST_ICONS_THEME_COLOR_5: '#4ECDC4'
          FOREST_ICONS_THEME_COLOR_6: '#8B5CF6'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 